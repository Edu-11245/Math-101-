<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Rule | قاعدة الضرب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Amiri:wght@400;700&family=Amiri+Quran&family=STIX+Two+Text:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../main.css">
<style>
.title{font-size:3.6em;font-weight:800;line-height:1.25}
.pill{display:inline-block;white-space:nowrap;font-size:.95em;font-weight:600;padding:.3em 1.1em;border-radius:2em;color:#fff;box-shadow:0 .15em .4em #14213d33}
.s1{background:var(--pen)}.s2{background:var(--teal)}.s3{background:var(--ink)}
.n{color:var(--pen)}.m{color:var(--teal)}.ib{display:inline-block}.op{display:inline-block;margin:0 .12em}
.card{background:#fff;border:.1em solid var(--line);border-radius:.8em;padding:.6em 1.3em;box-shadow:0 .2em .7em #14213d18;text-align:center}
.chapter{display:none;grid-template-columns:auto auto;gap:1em 3.5em;align-items:center;justify-items:center;width:max-content;text-align:center;position:relative}
.chapter.active{display:grid}.chapter.one{grid-template-columns:auto}
.chapter>.cap:first-child{grid-column:1/-1;justify-self:stretch;font-size:1.45em;font-weight:800;color:#fff;background:var(--ink);border-radius:.55em;padding:.3em 1.4em;margin-bottom:.4em;box-shadow:0 .15em .5em #14213d33}
.L,.R{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9em}
.R .card{max-width:21em;line-height:1.7;font-size:1.05em}
.card,.cap,.pill,.row{direction:rtl}
.eq,.qr,.eq *{direction:ltr}
/* الخط: Cairo للعربي + خط رياضي STIX للمعادلات */
.eq{font-family:'STIX Two Text','Cambria Math','Times New Roman',serif;font-weight:600;letter-spacing:.01em}
.eq i{font-style:italic}
.qr{display:flex;gap:.7em;align-items:baseline;margin:.25em 0;font-weight:800}
.qr>span:first-child{font-family:Cairo;color:var(--teal)}
/* حركات إضافية */
@keyframes drop{0%{transform:translateY(-1.8em) scale(.6);opacity:0}60%{transform:translateY(.15em) scale(1.1);opacity:1}100%{transform:none}}
@keyframes slide{from{transform:translateX(3em);opacity:0}to{transform:none;opacity:1}}
@keyframes zoom{from{transform:scale(.3) rotate(-6deg);opacity:0}70%{transform:scale(1.08)}to{transform:none;opacity:1}}
@keyframes write{from{clip-path:inset(-30% 0 -30% 100%)}to{clip-path:inset(-30% 0 -30% 0)}}
@keyframes flip{50%{transform:rotateX(90deg) scale(1.5);color:var(--pen)}}
@keyframes flash{0%,100%{background:transparent}30%{background:var(--hi)}}
@keyframes bounce{40%{transform:translateY(-.25em) scale(1.12)}70%{transform:translateY(.05em)}}
@keyframes glow{50%{opacity:1}}
@keyframes tw{50%{opacity:.95;transform:scale(1.5) rotate(45deg)}}
@keyframes fl{to{transform:translateY(-.8em) rotate(8deg)}}
.fx-drop{animation:drop .8s cubic-bezier(.3,1.4,.5,1)}.fx-slide{animation:slide .7s ease-out}.fx-zoom{animation:zoom .9s}
.fx-write{animation:write 1.3s ease-out both}.fx-flip{animation:flip .7s}.fx-flash{animation:flash .9s}.fx-bounce{animation:bounce .7s}.fx-glow::after{animation:glow 1.6s 2}
/* مقدمة */
.hello{font:700 3.4em/1.3 Amiri,Cairo,serif;color:var(--teal)}
.badge{font-size:1em;font-weight:700;color:var(--ink);background:var(--hi);padding:.2em 1.2em;border-radius:2em}
.fl{position:absolute;font:600 1.7em 'STIX Two Text',serif;color:var(--teal);opacity:.2;animation:fl 5s ease-in-out infinite alternate}
/* الدعاء */
.dua{position:relative;overflow:hidden;padding:1em 2.4em 1.2em;border-radius:1.2em;min-width:21em;background:radial-gradient(circle at 50% 0,#264a8a,var(--ink) 70%);border:.14em solid var(--hi);outline:.07em solid #ffd23f88;outline-offset:.3em;box-shadow:0 0 2em #ffd23f44,0 .4em 1.4em #14213d66}
.dua::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 2.5em #ffd23fbb;opacity:0;pointer-events:none}
.dua .lbl{display:inline-block;font-size:.9em;font-weight:700;color:var(--ink);background:var(--hi);padding:.15em 1.2em;border-radius:2em;margin-bottom:.4em}
.dl{font:400 2.2em/1.85 'Amiri Quran',Amiri,serif;color:var(--hi);text-shadow:0 0 .5em #ffd23f77;direction:rtl;white-space:nowrap;}
.dl .w{display:inline-block}
@keyframes wd{from{opacity:0;transform:translateY(.5em) scale(.85)}60%{transform:translateY(-.08em) scale(1.06)}to{opacity:1;transform:none}}
.fx-words .w{animation:wd .7s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(var(--i)*.3s)}
.sp{will-change:transform,opacity;position:absolute;width:.55em;height:.55em;background:var(--hi);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;animation:tw 2.6s ease-in-out infinite}
/* الحدود */
.tm{display:inline-block;position:relative;padding:0 .2em;border-radius:.3em}
.bd{position:absolute;left:0;right:0;top:-1.3em;margin:0 auto;width:1.8em;height:1.8em;border-radius:50%;color:#fff;font:700 .3em/1.8em Cairo;text-align:center}
.tbl2{display:grid;grid-template-columns:auto auto auto auto auto;gap:.5em .2em;align-items:center;justify-items:start}
.tbl2>.q{justify-self:end;margin-inline-end:.4em}
/* التايمر */
.salat{position:absolute;left:0;top:34%;z-index:6;pointer-events:none;padding:.5em 2.4em .5em 1.1em;background:var(--teal);color:#fff;font:700 clamp(15px,3.2cqh,26px)/1.4 Amiri,Cairo,serif;clip-path:polygon(0 0,calc(100% - 1.3em) 0,100% 50%,calc(100% - 1.3em) 100%,0 100%);border-left:.35em solid var(--hi);transform:translateX(-120%);direction:rtl;will-change:transform}
.timer{display:flex;flex-direction:column;align-items:center;gap:.3em;font-weight:700}
.rg{position:relative;width:7em;height:7em;display:grid;place-items:center}
.rg svg{position:absolute;inset:0;transform:rotate(-90deg)}
.rg circle{stroke-width:7}.rg .bg{fill:#fff;stroke:var(--line)}
.rg .fg{fill:none;stroke:var(--hi);stroke-linecap:round;stroke-dasharray:282.7}
#scene .rg .fg{transition:stroke-dashoffset 1s linear,stroke .3s}
.tn{font-size:3em;line-height:1;font-weight:800;color:var(--pen);font-variant-numeric:tabular-nums;z-index:1}
.timer.low .fg{stroke:var(--pen)}.timer.low .tn{animation:pulse .5s infinite}
/* ===== جديد: قاعدة الضرب ===== */
.cxg{position:relative;display:grid;align-items:center;justify-items:center;column-gap:.45em;row-gap:1.5em;direction:ltr}
.cxg .eq{white-space:nowrap}
.grp{display:inline-flex;gap:.12em;padding:0 .2em;border-radius:.3em;background:#fff;box-shadow:0 .1em .4em #14213d33;white-space:nowrap}
.bs{display:inline-block}
.tbl3{display:grid;grid-template-columns:auto auto auto auto auto;gap:.55em .4em;align-items:center;justify-items:start;direction:ltr}
.tbl3 .eq{white-space:nowrap}
.tbl3 .pill{font-size:.4em}
.wide{grid-column:3/-1}
@media (prefers-reduced-motion:reduce){.fl,.sp,.timer.low .tn{animation:none}}
</style>
</head>
<body>
<script src="../../../../main.js"></script>
<script>
const X='<i>x</i>',P=(c,p,k)=>c+X+(p===''?'':`<sup${k?` class="${k}"`:''}>${p}</sup>`);
const BD=(n,c,id)=>`<b class="bd hid" id="${id}" style="background:${c}">${n}</b>`;
const TIM=(id,n)=>`<div class="timer hid" id="${id}"><div class="rg"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="45"/><circle class="fg" cx="50" cy="50" r="45" style="stroke-dashoffset:0"/></svg><div class="tn">${n}</div></div><div>ثانية للحل — خد وقتك</div></div>`;
const C=(id,h,c='')=>`<span class="hid ${c}" id="${id}">${h}</span>`;
const AR=id=>C(id,'→','op');

/* وقفتين تايمر: الأولى 30 ثانية عند 1:52.3 — التانية 60 ثانية عند 9:59.0 */
const H1=112.3,D1=30,H2=599.0,D2=60;
const t=s=>{if(typeof s==='string'){const[a,b]=s.split(':');s=+a*60+ +b}return Math.round((s>H2?s+D1+D2:s>H1?s+D1:s)*1000)};
function tmr(sc,id,v,n){const e=sc.querySelector(id);if(!e)return;e.querySelector('.tn').textContent=v;e.querySelector('.fg').style.strokeDashoffset=(282.7*(1-v/n)).toFixed(1);e.classList.toggle('low',v>0&&v<=5)}
const ticks=(id,h,n)=>Array.from({length:n},(_,i)=>({t:h+(i+1)*1000,run:sc=>tmr(sc,id,n-1-i,n)}));

function arc(from,to,dur=1100){
  const sc=document.querySelector('#scene'),a=sc.querySelector(from),b=sc.querySelector(to);
  if(!a||!b)return;
  const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect(),cs=getComputedStyle(a);
  const k=a.offsetWidth?ra.width/a.offsetWidth:1,fa=parseFloat(cs.fontSize)*k,fb=parseFloat(getComputedStyle(b).fontSize)*k,s=fb/fa;
  const g=a.cloneNode(true);g.removeAttribute('id');g.classList.remove('hid');
  Object.assign(g.style,{position:'fixed',left:ra.left+'px',top:ra.top+'px',margin:0,fontSize:fa+'px',lineHeight:1,zIndex:5,transition:'none'});
  sc.append(g);
  const dx=rb.left+rb.width/2-ra.left-ra.width/2,dy=rb.top+rb.height/2-ra.top-fa/2;
  a.classList.add('dim');
  const an=g.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx/2}px,${dy/2-70}px) scale(${1+s/2})`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(${s})`}],
    {duration:sc.classList.contains('instant')?0:dur,easing:'ease-in-out',fill:'forwards'});
  an.onfinish=()=>{g.remove();b.classList.remove('hid')};
}

/* سهم الـ crisscross: بيترسم من تحت الخلية العليا لفوق الخلية السفلى */
function xar(box,from,to,color,dur=900){
  const sc=document.querySelector('#scene'),B=sc.querySelector(box),a=sc.querySelector(from),b=sc.querySelector(to);
  if(!B||!a||!b)return;
  const NS='http://www.w3.org/2000/svg',fs=parseFloat(getComputedStyle(B).fontSize)||20;
  let sv=B.querySelector('svg.xsv');
  if(!sv){sv=document.createElementNS(NS,'svg');sv.setAttribute('class','xsv');sv.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:4';B.append(sv)}
  const x1=a.offsetLeft+a.offsetWidth/2,y1=a.offsetTop+a.offsetHeight+fs*.1,x2=b.offsetLeft+b.offsetWidth/2,y2=b.offsetTop-fs*.15;
  const ang=Math.atan2(y2-y1,x2-x1),hl=fs*.55,ex=x2-hl*.8*Math.cos(ang),ey=y2-hl*.8*Math.sin(ang),L=Math.hypot(ex-x1,ey-y1);
  const ln=document.createElementNS(NS,'line');
  [['x1',x1],['y1',y1],['x2',ex],['y2',ey]].forEach(([k,v])=>ln.setAttribute(k,v));
  ln.style.cssText=`stroke:${color};stroke-width:${fs*.14}px;stroke-linecap:round;stroke-dasharray:${L};stroke-dashoffset:${L}`;
  const px=-Math.sin(ang)*hl*.5,py=Math.cos(ang)*hl*.5,bx=x2-hl*Math.cos(ang),by=y2-hl*Math.sin(ang);
  const hd=document.createElementNS(NS,'polygon');
  hd.setAttribute('points',`${x2},${y2} ${bx+px},${by+py} ${bx-px},${by-py}`);hd.style.cssText=`fill:${color};opacity:0`;
  sv.append(ln,hd);
  const d=sc.classList.contains('instant')?0:dur;
  ln.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:d,easing:'ease-out',fill:'forwards'});
  hd.animate([{opacity:0},{opacity:0,offset:.8},{opacity:1}],{duration:d,fill:'forwards'});
}

function activateChapter(sc,id){
  sc.querySelectorAll('.chapter').forEach(el=>el.classList.remove('active'));
  const next=sc.querySelector('#'+id);if(next)next.classList.add('active');
  const fit=sc.querySelector('#fit');
  if(fit&&fit.offsetWidth){const k=Math.min(1.6,sc.clientWidth*.94/fit.offsetWidth,sc.clientHeight*.84/fit.offsetHeight);fit.style.transform=`scale(${k})`}
}
const fly=(a,b,s)=>[{t:t(s),run:()=>arc(a,b)},{t:t(s)+1150,fx:[b,'bounce']}];
const go=id=>({run:sc=>activateChapter(sc,id)});
const pop=(id,fx='pop')=>({show:id,fx:[id,fx]});
const W=s=>s.split(' ').map((w,i)=>`<span class="w" style="--i:${i}">${w}</span>`).join(' ');
const sparks=[...Array(10)].map((_,i)=>`<b class="sp" style="left:${(i*37+8)%96}%;top:${(i*53+6)%92}%;animation-delay:${(i*.37).toFixed(2)}s"></b>`).join('');
const floats=['×','f′g','fg′','x²','x³','6x','+','5x⁴'].map((s,i)=>`<span class="fl" style="left:${(i*29)%110-8}%;top:${(i*41)%100}%;animation-delay:${i*.6}s">${s}</span>`).join('');

addEventListener('DOMContentLoaded',()=>{
  const st=document.querySelector('#stage');if(!st)return;
  const el=document.createElement('div');el.className='salat';el.textContent='صَلِّ عَلَى النَّبِيِّ ﷺ';st.append(el);
  const show=()=>{if(document.hidden)return;el.animate([{transform:'translateX(-120%)'},{transform:'translateX(0)',offset:.12},{transform:'translateX(.6em)',offset:.16},{transform:'translateX(0)',offset:.2},{transform:'translateX(0)',offset:.9},{transform:'translateX(-120%)'}],{duration:6500,easing:'ease-out'})};
  setInterval(show,60000);
});

Lesson({
  title:{ar:'قاعدة الضرب',en:'Product Rule'},
  scenes:[{
    title:{ar:'قاعدة الضرب',en:'The Product Rule'},
    audio:'Product.Rule',
    dur:767000,
    say:'شرح صوتي كامل باللهجة المصرية لقاعدة الضرب (Product Rule) مع مراجعة قاعدة المجموع وتمرين بوقفة 30 ثانية وتمرين بوقفة 60 ثانية.',
    stage:`
<!-- مقدمة -->
<div class="chapter one active" id="w">${floats}
  <div class="hello hid" id="wHi">السلام عليكم</div>
  <div class="badge hid" id="wNo">المحاضرة التالتة | Lecture 3</div>
  <div class="title hid" id="wT">قاعدة الضرب</div>
  <div class="title hid" id="wE" style="font-size:2.4em;color:var(--teal)">The Product Rule</div>
  <div class="cap hid" id="wC">التفاضل | Differentiation</div>
  <div class="eq md hid" id="wF">g(${X}) <span class="op n">·</span> h(${X})</div>
</div>

<!-- الدعاء -->
<div class="chapter one" id="d">
  <div class="dua hid" id="dP">${sparks}
    <div class="lbl hid" id="dL">دعاء قبل الدرس | Before we start</div>
    <div class="dl hid" id="du1">${W('﴿ رَبِّ اشْرَحْ لِي صَدْرِي')}</div>
    <div class="dl hid" id="du2">${W('وَيَسِّرْ لِي أَمْرِي')}</div>
    <div class="dl hid" id="du3">${W('وَاحْلُلْ عُقْدَةً مِنْ لِسَانِي')}</div>
    <div class="dl hid" id="du4">${W('يَفْقَهُوا قَوْلِي ﴾')}</div>
  </div>
</div>

<!-- مراجعة قاعدة المجموع -->
<div class="chapter" id="rv">
  <div class="cap">مراجعة سريعة | Sum Rule</div>
  <div class="L">
    <div class="pill s1 hid" id="rvT">قاعدة المجموع | Sum Rule</div>
    <div class="eq md hid" id="rvI">f(${X}) = ${P(3,2)} − 5${X} + 7</div>
    <div class="eq md hid" id="rvO">f′(${X}) = <span class="ib n hid" id="rvO1">6${X}</span> <span class="ib hid" id="rvO2">− 5</span> <span class="ib m hid" id="rvO3">+ 0</span></div>
  </div>
  <div class="R">
    <div class="card hid" id="rvS"><div class="cap">الإشارة بتروح مع الحد</div><div class="eq sm">− 5${X} → <span class="n">− 5</span></div></div>
    <div class="card hid" id="rvC"><div class="cap">أي رقم ثابت</div><div class="eq sm">7 → <span class="hl">0</span></div></div>
  </div>
</div>

<!-- اختبر نفسك 1 -->
<div class="chapter" id="q1">
  <div class="cap">اختبر نفسك | Quick Check</div>
  <div class="L"><div class="card">
    <div class="qr hid" id="q1a"><span>1)</span><span class="eq sm">${P('',6)} + ${P('',2)}</span></div>
    <div class="qr hid" id="q1b"><span>2)</span><span class="eq sm">${P(4,3)} − ${P(6,2)}</span></div>
    <div class="qr hid" id="q1c"><span>3)</span><span class="eq sm">${P(5,3)} + ${P(2,2)} − ${X} + 10</span></div>
    <div class="qr hid" id="q1d"><span>4)</span><span class="eq sm">${P(2,5)} − ${P(3,4)} + 7${X} − 8</span></div>
  </div></div>
  <div class="R">
    <div class="pill s1 hid" id="q1p">حل الأربع مسائل دول</div>
    <div class="card hid" id="q1n">عشان تعرف تكمّل المحاضرة دي ولا لأ</div>
    ${TIM('q1t',30)}
  </div>
</div>

<!-- إجابات 1 -->
<div class="chapter one" id="a1">
  <div class="cap">الإجابات | Answers</div>
  <div class="card"><div class="tbl2 eq" style="font-size:2.2em">
    <span class="q hid" id="r1q"><span id="s11" class="ib">${P('',6)}</span> + <span id="s12" class="ib">${P('',2)}</span> →</span>${C('r11',P(6,5,'m'))}${C('r12',' + 2'+X)}<span></span><span></span>
    <span class="q hid" id="r2q"><span id="s21" class="ib">${P(4,3)}</span> − <span id="s22" class="ib">${P(6,2)}</span> →</span>${C('r21',P(12,2,'m'))}${C('r22',' − 12'+X)}<span></span><span></span>
    <span class="q hid" id="r3q"><span id="s31" class="ib">${P(5,3)}</span> + <span id="s32" class="ib">${P(2,2)}</span> − <span id="s33" class="ib">${X}</span> + <span id="s34" class="ib">10</span> →</span>${C('r31',P(15,2,'m'))}${C('r32',' + 4'+X)}${C('r33',' − 1')}${C('r34',' + 0')}
    <span class="q hid" id="r4q"><span id="s41" class="ib">${P(2,5)}</span> − <span id="s42" class="ib">${P(3,4)}</span> + <span id="s43" class="ib">7${X}</span> − <span id="s44" class="ib">8</span> →</span>${C('r41',P(10,4,'m'))}${C('r42',' − 12'+X+'<sup class="m">3</sup>')}${C('r43',' + 7')}${C('r44',' − 0')}
  </div></div>
  <div class="card hid" id="a1F" style="border-color:var(--pen)">تصحيح: 5 × 2 = <b class="n">10</b> — يعني <span class="eq">10${X}<sup>4</sup></span> مش 15</div>
</div>

<!-- ذاكر أول بأول -->
<div class="chapter one" id="st">
  <div class="cap">التفاضل مبني على بعضه | Build step by step</div>
  <div class="row" style="gap:1.4em;align-items:stretch">
    <div class="card hid" id="stA"><div class="pill s2">حليتها صح؟</div><div class="cap" style="margin-top:.4em">كمّل المحاضرة</div></div>
    <div class="card hid" id="stB"><div class="pill s1">ما حليتهاش؟</div><div class="cap" style="margin-top:.4em">شوف فيديو المحاضرات اللي فاتت<br>اللينك في الوصف</div></div>
  </div>
  <div class="pill s3 hid" id="stC">التفاضل مبني على اللي قبله — ذاكر أول بأول</div>
</div>

<!-- مشكلة النهاردة -->
<div class="chapter one" id="p">
  <div class="cap">مشكلة النهاردة | Today's Problem</div>
  <div class="card hid" id="pA"><div class="cap">لحد دلوقتي: جمع وطرح بس</div><div class="eq sm">${P(3,4)} + ${P(2,2)} − 5${X}</div></div>
  <div class="row"><span class="pill s1 hid" id="pP">Power Rule: نزّل الأس واطرح 1</span><span class="pill s2 hid" id="pS">Sum Rule: لكل حد لوحده</span></div>
  <div class="eq md hid" id="pM" style="margin-top:.4em">f(${X}) = <span class="tm" id="pt1">g(${X})${BD(1,'var(--pen)','pb1')}</span> <span class="op" id="pX">×</span> <span class="tm" id="pt2">h(${X})${BD(2,'var(--teal)','pb2')}</span></div>
  <div class="pill s3 hid" id="pN">ضرب مش جمع ولا طرح | Product</div>
</div>

<!-- الطريقة الأولى: بسّط -->
<div class="chapter one" id="e1">
